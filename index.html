<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Skjult fra søkemotorer – dette er en privat logg. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trening" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Treningsloggbok</title>
</head>
<body>
  <!-- Innloggingsskjerm -->
  <section id="auth-screen" class="screen hidden">
    <div class="auth-card">
      <div class="logo">🏋️</div>
      <h1>Treningsloggbok</h1>
      <p class="muted" id="auth-subtitle">Logg inn med e-post for å holde loggene dine private.</p>

      <div id="auth-step-email">
        <label>E-post</label>
        <input id="auth-email" type="email" inputmode="email" autocomplete="email" placeholder="deg@eksempel.no" />
        <button id="auth-send" class="primary block">Send engangskode</button>
      </div>

      <div id="auth-step-code" class="hidden">
        <label>Engangskode (sjekk e-posten)</label>
        <input id="auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Engangskode fra e-post" />
        <button id="auth-verify" class="primary block">Logg inn</button>
        <button id="auth-back" class="ghost block">Bruk en annen e-post</button>
      </div>

      <p id="auth-msg" class="auth-msg"></p>
    </div>
  </section>

  <!-- Skjerm når Supabase ikke er satt opp -->
  <section id="setup-screen" class="screen hidden">
    <div class="auth-card">
      <div class="logo">⚙️</div>
      <h1>Koble til Supabase</h1>
      <p class="muted">Lim inn nøklene fra Supabase (Project Settings → API). Lagres bare på denne telefonen.</p>
      <label>Project URL</label>
      <input id="setup-url" type="url" placeholder="https://xxxx.supabase.co" />
      <label>anon public key</label>
      <input id="setup-key" type="text" placeholder="eyJhbGciOi..." />
      <button id="setup-save" class="primary block">Lagre og fortsett</button>
      <p id="setup-msg" class="auth-msg"></p>
    </div>
  </section>

  <!-- Hovedapp -->
  <main id="app" class="hidden">
    <!-- LOGG -->
    <section id="tab-log" class="tab">
      <header class="topbar">
        <h2>Logg økt</h2>
        <div class="date-picker">
          <input id="log-date" type="text" inputmode="numeric" maxlength="10"
                 placeholder="dd.mm.åååå" class="date-input" autocomplete="off" />
          <span id="log-weekday" class="date-weekday"></span>
        </div>
      </header>
      <div id="log-content" class="content"></div>
    </section>

    <!-- PROGRESJON -->
    <section id="tab-progress" class="tab hidden">
      <header class="topbar">
        <h2>Progresjon</h2>
      </header>
      <div class="content">
        <select id="progress-exercise" class="select"></select>
        <div class="chart-wrap"><canvas id="progress-chart"></canvas></div>
        <div id="progress-table"></div>
      </div>
    </section>

    <!-- ØVELSER -->
    <section id="tab-exercises" class="tab hidden">
      <header class="topbar">
        <h2>Øvelser</h2>
      </header>
      <div class="content">
        <div class="card add-exercise">
          <label>Ny øvelse</label>
          <input id="new-ex-name" type="text" placeholder="Navn (f.eks. Skulderpress)" />
          <div class="type-picker" id="new-ex-type">
            <button data-type="cardio" type="button">Kondisjon<small>minutter</small></button>
            <button data-type="strength" type="button" class="active">Styrke<small>kg × reps × sett</small></button>
            <button data-type="bodyweight" type="button">Kropp/matte<small>reps × sett</small></button>
          </div>
          <button id="add-ex-btn" class="primary block">Legg til øvelse</button>
        </div>
        <div id="exercise-list"></div>
      </div>
    </section>

    <!-- INNSTILLINGER -->
    <section id="tab-settings" class="tab hidden">
      <header class="topbar">
        <h2>Innstillinger</h2>
      </header>
      <div class="content">
        <div class="card">
          <div class="row-between"><span>Innlogget som</span><strong id="settings-email" class="muted"></strong></div>
          <button id="logout-btn" class="ghost block">Logg ut</button>
        </div>
        <p class="muted small">Treningsloggbok · data lagret i din egen Supabase.</p>
      </div>
    </section>

    <!-- Bunnmeny -->
    <nav class="tabbar">
      <button class="tabbtn active" data-tab="log"><span class="ic">📝</span>Logg</button>
      <button class="tabbtn" data-tab="progress"><span class="ic">📈</span>Progresjon</button>
      <button class="tabbtn" data-tab="exercises"><span class="ic">📋</span>Øvelser</button>
      <button class="tabbtn" data-tab="settings"><span class="ic">⚙️</span>Innst.</button>
    </nav>
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- Strong doge: dukker opp ved fullført økt -->
  <div id="doge-praise" class="doge-praise hidden" aria-hidden="true">
    <img src="./icons/strong-doge.png" alt="" />
  </div>

  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>

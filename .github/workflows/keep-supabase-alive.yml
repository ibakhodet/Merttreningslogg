# Holder Supabase-prosjektet i live.
#
# Supabase pauser gratis-prosjekter etter 7 dager uten aktivitet. Denne jobben
# kjører hver dag og gjør en ekte databasespørring mot prosjektet, slik at
# Supabase ser aktivitet og lar prosjektet stå på.
#
# Spørringen går via den offentlige anon-nøkkelen og er beskyttet av RLS
# (auth.uid() = user_id), så den får aldri se data – den returnerer en tom
# liste. Poenget er ikke svaret, men at Postgres faktisk kjører spørringen.
#
# Du kan også kjøre den manuelt for å teste:
#   GitHub -> fanen "Actions" -> "Hold Supabase i live" -> "Run workflow"

name: Hold Supabase i live

on:
  schedule:
    # 05:23 UTC hver dag. Unngår hele timen, som GitHub anbefaler,
    # og daglig kjøring gir god margin til 7-dagersgrensen selv om
    # GitHub skulle hoppe over en kjøring ved høy last.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Les Supabase-nøkler fra config.js
        id: cfg
        run: |
          set -euo pipefail
          url=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js)
          key=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Fant ikke SUPABASE_URL / SUPABASE_ANON_KEY i config.js"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Bruker prosjekt: $url"

      - name: Ping databasen
        env:
          SUPABASE_URL: ${{ steps.cfg.outputs.url }}
          SUPABASE_KEY: ${{ steps.cfg.outputs.key }}
        run: |
          set -uo pipefail
          endpoint="$SUPABASE_URL/rest/v1/exercises?select=id&limit=1"

          # Prøv inntil 3 ganger – en enkelt nettverkshikke skal ikke
          # få jobben til å feile og sende deg en unødvendig e-post.
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 30 -o /tmp/svar.txt -w '%{http_code}' \
              "$endpoint" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" || echo "000")

            echo "Forsøk $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Svar: $(cat /tmp/svar.txt)"
              echo "Databasen svarte som forventet – prosjektet er markert aktivt."
              exit 0
            fi

            echo "Svar: $(cat /tmp/svar.txt 2>/dev/null || true)"
            [ "$attempt" -lt 3 ] && sleep 15
          done

          echo "Fikk ikke kontakt med Supabase etter 3 forsøk."
          echo "Sjekk om prosjektet allerede er pauset, eller om anon-nøkkelen er byttet ut."
          exit 1
